#gate { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: #faf8ff; padding: 24px; }
#gate .box { width: 100%; max-width: 320px; text-align: center; }
#gate h1 { font-size: 17px; font-weight: 700; color: #1e293b; margin: 0 0 4px; }
#gate p { font-size: 13px; color: #94a3b8; margin: 0 0 20px; }
#gate .mark { width: 48px; height: 48px; border-radius: 14px; background: #7c3aed;
  color: #fff; display: grid; place-items: center; margin: 0 auto 14px;
  font-size: 20px; font-weight: 700; }
#gate input { width: 100%; box-sizing: border-box; padding: 11px 14px; font-size: 16px;
  text-align: center; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff;
  color: #1e293b; outline: none; }
#gate input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.14); }
#gate button { width: 100%; margin-top: 10px; padding: 11px 14px; font-size: 15px;
  font-weight: 600; color: #fff; background: #7c3aed; border: 0; border-radius: 12px;
  cursor: pointer; }
#gate button:disabled { opacity: .6; cursor: default; }
#gate .err { min-height: 18px; margin-top: 10px; font-size: 12.5px; color: #dc2626; }
</style>
</head>

    <input id="gate-input" type="password" inputmode="text"
           autocomplete="current-password" aria-label="비밀번호" required>
    <button id="gate-btn" type="submit">열기</button>
    <div class="err" id="gate-error" role="alert"></div>
  </form>
</div>

<script>
// 비밀번호 잠금 화면 (웹 호스팅용 빌드에만 삽입된다)
//
// 성적·생기부는 AES-GCM으로 암호화돼 페이지에 들어있고, 키는 비밀번호에서
// PBKDF2(25만 회)로 유도한다. 즉 소스를 내려받아 열어봐도 비밀번호 없이는
// 내용을 볼 수 없다. 비밀번호가 맞아야 시드를 복호화하고 그때 앱을 띄운다.
(function () {
  const KEY = "msa-passcode";
  const enc = new TextEncoder();
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  const box = document.getElementById("gate");
  const form = document.getElementById("gate-form");
  const input = document.getElementById("gate-input");
  const err = document.getElementById("gate-error");
  const btn = document.getElementById("gate-btn");

  async function decrypt(pass) {
    const base = await crypto.subtle.importKey(
      "raw",
      enc.encode(pass),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: b64(window.__MSA_SALT__),
        iterations: 250000,
        hash: "SHA-256",
      },
      base,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(window.__MSA_IV__) },
      key,
      b64(window.__MSA_DATA__)
    );
    return JSON.parse(new TextDecoder().decode(plain));
  }

  async function boot(seed) {
    window.__MSA_SEED__ = seed;
    box.remove();
    const src = document.getElementById("msa-app").textContent;
    const url = URL.createObjectURL(
      new Blob([src], { type: "text/javascript" })
    );
    await import(url);
  }

  async function tryPass(pass, { remember }) {
    const seed = await decrypt(pass); // 틀리면 예외
    if (remember) {
      try {
        localStorage.setItem(KEY, pass);
      } catch {
        /* 저장 실패해도 이번 세션은 정상 동작 */
      }
    }
    await boot(seed);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "확인 중…";
    try {
      await tryPass(input.value, { remember: true });
    } catch {
      err.textContent = "비밀번호가 맞지 않습니다.";
      btn.disabled = false;
      btn.textContent = "열기";
      input.select();
    }
  });

  // 이전에 입력해둔 비밀번호가 있으면 그대로 통과 (기기별로 저장됨)
  (async () => {
    let saved = null;
    try {
      saved = localStorage.getItem(KEY);
    } catch {
      /* 접근 불가면 그냥 물어본다 */
    }
    if (saved) {
      try {
        await tryPass(saved, { remember: false });
        return;
      } catch {
        try {
          localStorage.removeItem(KEY);
        } catch {
          /* noop */
        }
      }
    }
    box.hidden = false;
    input.focus();
  })();
})();

</script>
